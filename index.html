<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Inferno Knight</title>
<style>html,body{margin:0;height:100%;background:#0a0a0f;color:#fbbf24;font-family:monospace}
#boot{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px}</style>
</head><body><div id="boot"><div>Loading Inferno Knight…</div><div id="pct">0%</div></div>
<script>
(async function(){
  const n = 14;
  const parts = [];
  const pct = document.getElementById('pct');
  for (let i = 0; i < n; i++) {
    const r = await fetch('part' + i + '.b64?v=2');
    if (!r.ok) throw new Error('missing part ' + i);
    parts.push(await r.text());
    pct.textContent = Math.round(((i+1)/n)*100) + '%';
  }
  const bin = Uint8Array.from(atob(parts.join('')), c => c.charCodeAt(0));
  const html = new TextDecoder('utf-8').decode(bin);
  document.open(); document.write(html); document.close();
})().catch(e => {
  document.getElementById('boot').innerHTML = '<div style="max-width:420px;text-align:center">Could not load the game.<br><br>Enable GitHub Pages on this repo (Settings → Pages → Deploy from branch <b>main</b> / root), wait a minute, then refresh.</div><pre style="opacity:.6">'+e+'</pre>';
});
</script></body></html>
